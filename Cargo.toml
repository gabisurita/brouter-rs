[package]
name = "brouter-rs"
version = "0.1.0"
edition = "2021"
authors = ["Gabriela Surita"]
license = "MIT"
description = "Pure BRouter bicycle routing engine in idiomatic Rust"
repository = "https://github.com/gabisurita/brouter-rs"
readme = "README.md"
keywords = ["brouter", "routing", "openstreetmap", "bicycle", "navigation"]
categories = ["algorithms", "science::geo"]
exclude = [
    "data/*",
    "fixtures/*",
    "profiles/*",
    "tools/*",
    "routes_comparison.html",
]

[features]
default = ["rayon"]
rayon = ["dep:rayon"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
